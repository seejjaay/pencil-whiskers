<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pencil Whiskers</title>
    <style>
      :root {
        --tint: 0.28;
        --ink: #5b3b4a;
        --cream: #fff6ee;
        --blush: #ffd6e4;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #fbe9ef;
        font-family: ui-rounded, 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
        color: var(--ink);
      }
      #video, #tint, #stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }
      #video {
        object-fit: cover;
        transform: scaleX(-1);
      }
      #tint {
        pointer-events: none;
        background: linear-gradient(180deg, rgba(255, 220, 234, var(--tint)), rgba(214, 236, 255, var(--tint)));
      }
      #stage { display: block; touch-action: none; }
      body[data-mode='mouse'] #stage { cursor: none; }
      #mode {
        position: fixed;
        left: 12px;
        bottom: 12px;
        padding: 8px 14px;
        border-radius: 999px;
        border: 3px solid var(--ink);
        background: var(--cream);
        color: var(--ink);
        font-weight: 600;
        font-size: 14px;
        line-height: 1;
        font-family: inherit;
        cursor: pointer;
      }
      #mode:focus-visible, #status button:focus-visible, #tuning button:focus-visible { outline: 3px solid #8fb8ff; outline-offset: 2px; }
      #tuning {
        position: fixed;
        top: 12px;
        right: 12px;
        width: 290px;
        max-height: calc(100vh - 24px);
        overflow: auto;
        padding: 12px 14px;
        border-radius: 16px;
        border: 3px solid var(--ink);
        background: rgba(255, 246, 238, 0.95);
        font-size: 13px;
      }
      #tuning[hidden] { display: none; }
      #tuning h2 { margin: 0 0 8px; font-size: 16px; }
      #tuning label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 8px; }
      #tuning input { grid-column: 1 / -1; width: 100%; accent-color: #d36f98; }
      #tuning output { font-variant-numeric: tabular-nums; }
      #tuning button { margin-top: 4px; }
      #tuning p { margin: 6px 0 0; opacity: 0.7; }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 64px;
        transform: translateX(-50%);
        max-width: calc(100vw - 32px);
        padding: 8px 16px;
        border-radius: 999px;
        border: 3px solid var(--ink);
        background: var(--cream);
        font-size: 14px;
        font-weight: 600;
        pointer-events: none;
      }
      #toast[hidden] { display: none; }
      #panel {
        position: fixed;
        left: 50%;
        top: 46%;
        transform: translate(-50%, -50%);
        width: min(500px, calc(100vw - 32px));
        padding: 26px 30px 22px;
        border-radius: 28px;
        border: 5px solid var(--ink);
        background: rgba(255, 246, 238, 0.94);
        box-shadow: 0 10px 0 rgba(91, 59, 74, 0.25);
        text-align: center;
        pointer-events: none;
      }
      #panel[hidden] { display: none; }
      #panel h1 { margin: 0 0 10px; font-size: 34px; letter-spacing: 0.5px; }
      #panel .lead { margin: 0 0 12px; font-size: 16px; line-height: 1.5; }
      #panel .stats { margin: 0 0 14px; font-size: 17px; font-weight: 700; }
      #panel .stats[hidden] { display: none; }
      #panel .hint { margin: 14px 0 0; font-size: 14px; opacity: 0.75; }
      #panel button {
        pointer-events: auto;
        padding: 12px 34px;
        border-radius: 999px;
        border: 4px solid var(--ink);
        background: #f39bbb;
        color: var(--ink);
        font-weight: 800;
        font-size: 20px;
        line-height: 1;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 5px 0 rgba(91, 59, 74, 0.3);
      }
      #panel button:hover { background: #f7b1ca; }
      #panel button:focus-visible { outline: 3px solid #8fb8ff; outline-offset: 3px; }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        margin: 0;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(40, 24, 34, 0.72);
        color: #ffeef5;
        font: 12px/1.45 ui-monospace, 'Cascadia Mono', Consolas, monospace;
        white-space: pre;
        pointer-events: none;
      }
      #hud[hidden] { display: none; }
      #status {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        max-width: min(520px, calc(100vw - 32px));
        padding: 22px 26px;
        border-radius: 22px;
        border: 4px solid var(--ink);
        background: var(--cream);
        box-shadow: 0 8px 0 rgba(91, 59, 74, 0.25);
        text-align: center;
        pointer-events: none;
      }
      #status.error { pointer-events: auto; }
      #status[hidden], #status button[hidden] { display: none; }
      #status button, #tuning button {
        padding: 8px 16px;
        border-radius: 999px;
        border: 3px solid var(--ink);
        background: #fff;
        color: var(--ink);
        font-weight: 600;
        font-size: 14px;
        line-height: 1;
        font-family: inherit;
        cursor: pointer;
      }
      #status button { margin-top: 14px; }
      #status h1 { margin: 0 0 6px; font-size: 22px; }
      #status p { margin: 0; font-size: 15px; line-height: 1.45; }
      #status.error { background: var(--blush); }
    </style>
  </head>
  <body>
    <video id="video" playsinline muted></video>
    <div id="tint"></div>
    <canvas id="stage"></canvas>
    <pre id="hud" aria-live="off"></pre>
    <div id="status" role="status" aria-live="polite">
      <h1>Pencil Whiskers</h1>
      <p>Getting ready…</p>
      <button type="button" hidden>Draw with the mouse</button>
    </div>
    <button id="mode" type="button">Drawing with: mouse (M)</button>
    <div id="tuning" hidden></div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <div id="panel" role="dialog" aria-modal="false" aria-labelledby="panel-title" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
