<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pencil Whiskers</title>
    <style>
      :root {
        --tint: 0.28;
        --ink: #5b3b4a;
        --cream: #fff6ee;
        --blush: #ffd6e4;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #fbe9ef;
        font-family: ui-rounded, 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
        color: var(--ink);
      }
      #video, #tint, #stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }
      #video {
        object-fit: cover;
        transform: scaleX(-1);
      }
      #tint {
        pointer-events: none;
        background: linear-gradient(180deg, rgba(255, 220, 234, var(--tint)), rgba(214, 236, 255, var(--tint)));
      }
      #stage { display: block; }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        margin: 0;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(40, 24, 34, 0.72);
        color: #ffeef5;
        font: 12px/1.45 ui-monospace, 'Cascadia Mono', Consolas, monospace;
        white-space: pre;
        pointer-events: none;
      }
      #hud[hidden] { display: none; }
      #status {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        max-width: min(520px, calc(100vw - 32px));
        padding: 22px 26px;
        border-radius: 22px;
        border: 4px solid var(--ink);
        background: var(--cream);
        box-shadow: 0 8px 0 rgba(91, 59, 74, 0.25);
        text-align: center;
      }
      #status[hidden] { display: none; }
      #status h1 { margin: 0 0 6px; font-size: 22px; }
      #status p { margin: 0; font-size: 15px; line-height: 1.45; }
      #status.error { background: var(--blush); }
    </style>
  </head>
  <body>
    <video id="video" playsinline muted></video>
    <div id="tint"></div>
    <canvas id="stage"></canvas>
    <pre id="hud" aria-live="off"></pre>
    <div id="status" role="status" aria-live="polite">
      <h1>Pencil Whiskers</h1>
      <p>Getting ready…</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
